name: Qix
options:
  bundleIdPrefix: quebec.spe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: true
  # The Xcode version whose recommended settings the project has taken (LastUpgradeCheck).
  xcodeVersion: "27.2"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  QixKit:
    path: QixKit
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.7
targets:
  Qix:
    type: application
    platform: iOS
    sources:
      - path: Qix
    dependencies:
      - package: QixKit
    info:
      path: Qix/Resources/Info.plist
      properties:
        # The launch screen is the backdrop alone, so the playfield appears without a flash.
        UILaunchScreen:
          UIColorName: Backdrop
        # Landscape only: the 4:3 board fills the height and leaves room for a thumb on each side.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: quebec.spe.Qix
        # Signs local device builds.
        DEVELOPMENT_TEAM: SGHB6DGT2T
        # iPhone only.
        TARGETED_DEVICE_FAMILY: "1"
        # No icon yet: xcodegen names an AppIcon set the asset catalog does not have.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  QixTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QixTests
    dependencies:
      - target: Qix
      - package: QixKit
  QixSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QixSnapshotTests
        # The reference images are read by path, not from the bundle.
        excludes:
          - "__Snapshots__"
    dependencies:
      - target: Qix
      - package: QixKit
      - package: SnapshotTesting
  QixUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: QixUITests
    dependencies:
      - target: Qix
schemes:
  Qix:
    build:
      targets:
        Qix: all
        QixTests: [test]
        QixSnapshotTests: [test]
        QixUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QixTests
        - QixSnapshotTests
        - QixUITests
